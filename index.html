<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 Codex 网页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #eff6ff, #f0fdfa);
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 48px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 16px 48px #0f172a0d;
    }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 8vw, 48px); }
    p { margin: 0 0 32px; color: #475569; line-height: 1.6; }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #1e40af; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Hello Codex</h1>
    <p>我的第一个 Codex 网页</p>
    <button type="button">点击我</button>
  </main>
</body>
</html>
